name: Verificações

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    name: Lint, tipos, preços e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Testes do motor de preços
        run: npm run teste-precos

      - name: Build
        run: npm run build

  interface:
    name: Playwright (interface + autenticação)
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Dados de exemplo
        run: npm run dados-exemplo -- --forcar

      - name: Arrancar servidor (sem auth)
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:43127/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Servidor não arrancou a tempo"
          exit 1

      - name: Teste de interface
        run: npm run teste-interface -- http://127.0.0.1:43127

      - name: Teste de autenticação
        run: npm run teste-autenticacao
